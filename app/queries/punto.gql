fragment PuntoFields on Punto {
    id
    nombre
    latitud
    longitud
    activo
    eleccionId
    createdAt
    updatedAt
}

query GetPuntosByEleccion($eleccionId: ID!) {
    puntosByEleccion(eleccionId: $eleccionId) {
        ...PuntoFields
    }
}

query GetPunto($id: ID!) {
    punto(id: $id) {
        ...PuntoFields
        jurados {
            ...JuradoFields
        }
        terminales {
            ...TerminalFields
        }
    }
}

mutation GenerarSecretoPunto($puntoId: ID!) {
    generarSecretoPunto(puntoId: $puntoId) {
        puntoId
        secreto
    }
}
